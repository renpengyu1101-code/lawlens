# LawLens 反向代理（公网发布用）
# 放置：/etc/nginx/sites-available/lawlens  → 软链到 sites-enabled
# 证书：certbot --nginx -d lawlens.example.com

upstream lawlens_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# 上传体积上限：后端 MAX_UPLOAD_MB 默认 20，这里留余量
client_max_body_size 40m;

server {
    listen 80;
    server_name lawlens.example.com;
    # 备案通过后把 80 全部跳转 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lawlens.example.com;

    ssl_certificate     /etc/letsencrypt/live/lawlens.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lawlens.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 上传与长任务：抽取/OCR 可能跑几十秒，别让代理提前掐断
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://lawlens_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://lawlens_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 暴力破解防护：先在上层 nginx.conf 的 http{} 里加一行
    #   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # 再打开下面的 location（两条指令不能放在同一个上下文里）
    #
    # location = /api/auth/login {
    #     limit_req zone=login burst=5 nodelay;
    #     proxy_pass http://lawlens_app;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
